<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打破墙壁 🧱</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#20355f,#080d1d 70%);color:#eef5ff;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:18px}.game{width:min(100%,560px);text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,6vw,36px)}.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 12px;font-weight:700}.score{color:#79f2d0}.hint{color:#aab8d2;font-size:13px}canvas{display:block;width:100%;height:auto;border:2px solid #526b9c;border-radius:14px;background:#101a35;box-shadow:0 18px 55px #0008;touch-action:none}.action{min-height:48px;padding:10px 24px;margin-top:14px;border:0;border-radius:999px;background:#77f2ce;color:#10223a;font-size:16px;font-weight:800;cursor:pointer}.action:hover{background:#a0ffe2}.message{height:24px;margin-top:8px;color:#ffd77a;font-weight:700}
</style>
</head>
<body><main class="game"><h1>打破墙壁 🧱</h1><div class="bar"><span>分数：<span class="score" id="score">0</span></span><span class="hint">移动鼠标或手指控制挡板</span></div><canvas id="game" width="480" height="640" aria-label="打砖块游戏区域"></canvas><button class="action" id="start">开始游戏</button><div class="message" id="message">准备好了吗？</div></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),message=document.getElementById('message'),button=document.getElementById('start');
const W=canvas.width,H=canvas.height, paddle={w:96,h:14,x:(W-96)/2,y:H-42},ball={x:W/2,y:H-66,r:8,vx:3.2,vy:-4.2};
const colors=['#ff6b6b','#ffad5a','#ffe66d','#69e6a6','#58c8ff'];let bricks=[],score=0,state='ready',last=0;
function makeBricks(){bricks=[];for(let row=0;row<5;row++)for(let col=0;col<8;col++)bricks.push({x:22+col*55,y:66+row*28,w:49,h:19,color:colors[row]})}
function reset(){score=0;scoreEl.textContent='0';paddle.x=(W-paddle.w)/2;ball.x=W/2;ball.y=H-66;ball.vx=(Math.random()<.5?-1:1)*3.2;ball.vy=-4.2;makeBricks();state='ready';message.textContent='移动挡板，然后点击“开始游戏”';draw()}
function start(){if(state==='over')reset();state='playing';message.textContent='';button.textContent='重新开始';console.log('[打砖块] 一局开始');last=performance.now();requestAnimationFrame(loop)}
function move(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(state!=='playing')draw()}
canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',e=>{move(e);if(state!=='playing')start()});button.addEventListener('click',()=>{if(state==='playing'){reset();button.textContent='开始游戏'}else start()});
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101a35';ctx.fillRect(0,0,W,H);for(const b of bricks){roundRect(b.x,b.y,b.w,b.h,5,b.color);ctx.fillStyle='#ffffff35';ctx.fillRect(b.x+5,b.y+3,b.w-10,2)}roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7,'#83f5d1');ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#8fefff';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;if(state==='ready'){ctx.fillStyle='#c5d3ef';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('点击场地或按钮开始',W/2,H/2)}}
function end(won){state='over';message.textContent=won?'全部砖块清除！你赢了！':'球掉出去了，本局结束';button.textContent='再玩一次';console.log(`[打砖块] 一局结束：得分 ${score}，${won?'胜利':'失败'}`);draw()}
function loop(t){if(state!=='playing')return;const dt=Math.min((t-last)/16.67,2);last=t;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.y=paddle.y-ball.r;const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5;ball.vy=-Math.max(3.5,Math.sqrt(36-ball.vx*ball.vx))}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){bricks.splice(i,1);score+=10;scoreEl.textContent=score;ball.vy*=-1;break}}if(bricks.length===0){end(true);return}if(ball.y-ball.r>H){end(false);return}draw();requestAnimationFrame(loop)}
makeBricks();draw();
})();
</script></body></html>
