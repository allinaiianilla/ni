<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打破墙壁 🧱</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#20355f,#080d1d 70%);color:#eef5ff;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;padding:clamp(6px,2vh,18px)}.game{width:min(100%,calc((100vh - 150px)*0.75),calc((100vw - 24px)*0.875));height:100%;max-height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center}h1{margin:0 0 8px;font-size:clamp(24px,6vw,36px)}.bar{display:flex;justify-content:space-between;align-items:center;margin:10px 4px 12px;font-weight:700}.score{color:#79f2d0}.hint{color:#aab8d2;font-size:13px}canvas{display:block;width:100%;height:auto;max-height:calc(100vh - 170px);aspect-ratio:3/4;object-fit:contain;border:2px solid #526b9c;border-radius:14px;background:#101a35;box-shadow:0 18px 55px #0008;touch-action:none}.action{min-height:48px;padding:10px 24px;margin-top:14px;border:0;border-radius:999px;background:#77f2ce;color:#10223a;font-size:16px;font-weight:800;cursor:pointer}.action:hover{background:#a0ffe2}.controls{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}.controls label{font-weight:700}.controls input{width:86px;min-height:48px;padding:8px;border:2px solid #526b9c;border-radius:10px;background:#101a35;color:#eef5ff;font-size:16px;text-align:center}.controls .action{margin-top:0}.message{height:24px;margin-top:8px;color:#ffd77a;font-weight:700}
</style>
</head>
<body><main class="game"><h1>打破墙壁 🧱</h1><div class="bar"><span>分数：<span class="score" id="score">0</span></span><span class="hint">移动鼠标或手指控制挡板</span></div><canvas id="game" width="480" height="640" aria-label="打砖块游戏区域"></canvas><div class="controls"><label for="speed">初始速度</label><input id="speed" type="number" min="2" max="8" step="0.5" value="4.2" aria-label="小球初始速度，范围 2 到 8" inputmode="decimal"><button class="action" id="start">开始游戏</button></div><div class="message" id="message">准备好了吗？</div></main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),message=document.getElementById('message'),button=document.getElementById('start'),speedInput=document.getElementById('speed');
let W=480,H=640,paddle={w:96,h:14,x:(W-96)/2,y:H-42},ballRadius=8;
const colors=['#ff6b6b','#ffad5a','#ffe66d','#69e6a6','#58c8ff'];let bricks=[],balls=[],score=0,state='ready',last=0;
function resize(){const rect=canvas.getBoundingClientRect(),oldW=W,oldH=H;W=Math.max(280,Math.round(rect.width));H=Math.max(320,Math.round(rect.height));canvas.width=W;canvas.height=H;paddle.w=W*.2;paddle.h=Math.max(10,W*.03);paddle.y=H-42;paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x/oldW*W));ballRadius=Math.max(6,W*.017);for(const b of balls){b.x=b.x/oldW*W;b.y=b.y/oldH*H;b.r=ballRadius}makeBricks();draw()}
window.addEventListener('resize',resize);
function makeBricks(){bricks=[];const rows=7,columnsCount=8,brickGap=Math.max(3,W*.008),side=Math.max(10,W*.04),brickW=(W-side*2-brickGap*(columnsCount-1))/columnsCount,brickH=Math.max(12,brickW*.38),top=Math.max(36,H*.075),rowGap=Math.max(3,brickH*.28);for(let row=0;row<rows;row++){const columns=Array.from({length:columnsCount},(_,i)=>i);for(let i=columns.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[columns[i],columns[j]]=[columns[j],columns[i]]}const rainbowColumns=new Set(columns.slice(0,2));for(let col=0;col<8;col++)bricks.push({x:side+col*(brickW+brickGap),y:top+row*(brickH+rowGap),w:brickW,h:brickH,color:rainbowColumns.has(col)?'rainbow':colors[row]})}}
function getSpeed(){let speed=Number(speedInput.value);if(!Number.isFinite(speed))speed=4.2;speed=Math.max(2,Math.min(8,speed));speedInput.value=speed;return speed}
function reset(){score=0;scoreEl.textContent='0';paddle.x=(W-paddle.w)/2;const speed=getSpeed();balls=[{x:W/2,y:H-66,r:ballRadius,vx:(Math.random()<.5?-1:1)*speed*.76,vy:-speed}];makeBricks();state='ready';message.textContent='移动挡板，然后点击“开始游戏”';draw()}
function start(){if(state==='over')reset();state='playing';message.textContent='';button.textContent='重新开始';console.log('[打砖块] 一局开始');last=performance.now();requestAnimationFrame(loop)}
function move(e){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));if(state!=='playing')draw()}
canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerdown',e=>{move(e);if(state!=='playing')start()});button.addEventListener('click',()=>{if(state==='playing'){reset();button.textContent='开始游戏'}else start()});
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#101a35';ctx.fillRect(0,0,W,H);for(const b of bricks){if(b.color==='rainbow'){const g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y);['#ff4d6d','#ff9f1c','#ffe66d','#2ec4b6','#4895ef','#9b5de5'].forEach((c,i)=>g.addColorStop(i/5,c));roundRect(b.x,b.y,b.w,b.h,5,g)}else roundRect(b.x,b.y,b.w,b.h,5,b.color);ctx.fillStyle='#ffffff55';ctx.fillRect(b.x+5,b.y+3,b.w-10,2)}roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7,'#83f5d1');for(const ball of balls){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#8fefff';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0}if(state==='ready'){ctx.fillStyle='#c5d3ef';ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText('点击场地或按钮开始',W/2,H/2)}}
function end(won){state='over';message.textContent=won?'全部砖块清除！你赢了！':'所有球都掉出去了，本局结束';button.textContent='再玩一次';console.log(`[打砖块] 一局结束：得分 ${score}，${won?'胜利':'失败'}`);draw()}
function loop(t){if(state!=='playing')return;const dt=Math.min((t-last)/16.67,2);last=t;for(let n=balls.length-1;n>=0;n--){const ball=balls[n];ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x-ball.r<0){ball.x=ball.r;ball.vx=Math.abs(ball.vx)}if(ball.x+ball.r>W){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx)}if(ball.y-ball.r<0){ball.y=ball.r;ball.vy=Math.abs(ball.vy)}if(ball.vy>0&&ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.y=paddle.y-ball.r;const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.vx=hit*5;ball.vy=-Math.max(3.5,Math.sqrt(36-ball.vx*ball.vx))}for(let i=bricks.length-1;i>=0;i--){const b=bricks[i];if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){bricks.splice(i,1);score+=10;scoreEl.textContent=score;if(b.color==='rainbow'){balls.push({x:ball.x,y:ball.y,r:ballRadius,vx:-ball.vx||3.2,vy:-Math.abs(ball.vy)});message.textContent='击中彩虹砖！获得一个新球！';setTimeout(()=>{if(state==='playing')message.textContent=''},1400)}ball.vy*=-1;break}}if(ball.y-ball.r>H)balls.splice(n,1)}if(bricks.length===0){end(true);return}if(balls.length===0){end(false);return}draw();requestAnimationFrame(loop)}
resize();{const speed=getSpeed();balls=[{x:W/2,y:H-66,r:ballRadius,vx:speed*.76,vy:-speed}]}draw();
})();
</script></body></html>
